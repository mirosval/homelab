apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tessera
  namespace: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`tessera.doma.lol`)
      services:
        - name: tessera-web
          port: 8099
  tls:
    certResolver: letsencrypt
    domains:
      - main: doma.lol
        sans:
          - '*.doma.lol'
