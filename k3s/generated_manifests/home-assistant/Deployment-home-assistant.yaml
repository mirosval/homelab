apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Berlin
          image: ghcr.io/home-assistant/home-assistant:2026.4.2
          name: home-assistant
          ports:
            - containerPort: 8123
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
            privileged: true
          volumeMounts:
            - mountPath: /config
              name: home-assistant-config-volume
            - mountPath: /run/dbus
              name: d-bus
            - mountPath: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_cc5121307674ef11af55c48c8fcc3fa0-if00-port0
              name: zigbee
        - env:
            - name: TZ
              value: Europe/Berlin
            - name: SCREEN_DEV
              value: "1"
            - name: HA_API
              value: http://127.0.0.1:8123/api
            - name: HA_TOKEN_FILE
              value: /tessera-secrets/ha_token
            - name: ESPHOME_CONFIG
              value: /config
            - name: SCREEN_DATA
              value: /data
          image: ghcr.io/maxgramser/homeassistant_espscreen:0.4.90
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --output
                - /dev/null
                - http://127.0.0.1:8099/health
            initialDelaySeconds: 30
          name: tessera
          ports:
            - containerPort: 8099
            - containerPort: 8098
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --output
                - /dev/null
                - http://127.0.0.1:8099/health
          volumeMounts:
            - mountPath: /config
              name: tessera-esphome
            - mountPath: /data
              name: tessera-data
            - mountPath: /tessera-secrets
              name: tessera-ha-token
              readOnly: true
      initContainers:
        - command:
            - sh
            - -c
            - |
              VERSION=1.4.0
              SHA256=7b2255fa3f25b97d465c17336cae8188bcc4dfefd52677682f084c1e39a54cac
              DIR=/config/custom_components/ingress
              TMP=/config/custom_components/.ingress-new

              if grep -q "\"version\": \"$VERSION\"" "$DIR/manifest.json" 2>/dev/null; then
                echo "hass_ingress $VERSION already installed, nothing to do"
                exit 0
              fi

              rm -rf "$TMP" /tmp/ingress.zip
              if timeout 120 wget -q -T 30 -O /tmp/ingress.zip "https://github.com/lovelylain/hass_ingress/releases/download/$VERSION/ingress.zip" \
                && echo "$SHA256  /tmp/ingress.zip" | sha256sum -c - \
                && mkdir -p "$TMP" \
                && unzip -q /tmp/ingress.zip -d "$TMP" \
                && grep -q "\"version\": \"$VERSION\"" "$TMP/manifest.json" \
                && rm -rf "$DIR" \
                && mv "$TMP" "$DIR"; then
                echo "installed hass_ingress $VERSION"
              else
                echo "WARNING: could not install hass_ingress $VERSION, continuing without changes"
                rm -rf "$TMP"
              fi
              exit 0
          image: alpine:3.22
          name: install-hass-ingress
          volumeMounts:
            - mountPath: /config
              name: home-assistant-config-volume
      nodeSelector:
        environment: zigbee
      volumes:
        - name: home-assistant-config-volume
          persistentVolumeClaim:
            claimName: home-assistant-pvc
        - hostPath:
            path: /run/dbus
          name: d-bus
        - hostPath:
            path: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_cc5121307674ef11af55c48c8fcc3fa0-if00-port0
          name: zigbee
        - name: tessera-esphome
          persistentVolumeClaim:
            claimName: tessera-esphome-pvc
        - name: tessera-data
          persistentVolumeClaim:
            claimName: tessera-data-pvc
        - name: tessera-ha-token
          secret:
            secretName: tessera
